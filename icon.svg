      <stop offset="0" stop-color="#7b5cff"/>
      <stop offset="0.5" stop-color="#c56cf0"/>
      <stop offset="1" stop-color="#ff9ecd"/>
    </linearGradient>
    <clipPath id="globe"><circle cx="246" cy="272" r="150"/></clipPath>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- glow -->
  <circle cx="246" cy="272" r="172" fill="#fff0fb" opacity="0.35"/>

  <!-- globe -->
