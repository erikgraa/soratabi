  <path d="M90 92 l7 -18 l7 18 l18 7 l-18 7 l-7 18 l-7 -18 l-18 -7 Z" fill="#ffcf3f" stroke="#3a2e5c" stroke-width="5" stroke-linejoin="round"/>
