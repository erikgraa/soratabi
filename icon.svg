  <circle cx="246" cy="272" r="150" fill="none" stroke="#3a2e5c" stroke-width="14"/>
  <!-- wave squiggles -->
  <path d="M215 330 q8 -8 16 0 t16 0" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" opacity="0.7"/>

