    <path d="M270 150 C320 130 380 160 395 200 C405 230 360 240 330 230 C300 220 260 200 270 150 Z" fill="#ffe08a"/>
    <path d="M290 260 C330 250 370 270 375 310 C380 360 340 400 305 395 C275 390 280 340 270 310 C262 285 270 265 290 260 Z" fill="#ffb3c7"/>
    <path d="M185 360 C210 350 240 370 235 400 C230 425 190 430 175 410 C165 395 170 368 185 360 Z" fill="#c9b6ff"/>
  </g>
