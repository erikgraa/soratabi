  <g transform="translate(408 112) rotate(2)" stroke="#3a2e5c" stroke-width="8" stroke-linejoin="round">
    <path d="M-38 0 C-38 -9 -30 -12 0 -12 L28 -12 C44 -12 52 -6 52 0 C52 6 44 12 28 12 L0 12 C-30 12 -38 9 -38 0 Z" fill="#fff"/>
