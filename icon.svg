  <path d="M120 330 C130 190 260 110 392 112" fill="none" stroke="#ffcf3f" stroke-width="12" stroke-linecap="round" stroke-dasharray="26 18"/>
  <circle cx="120" cy="330" r="16" fill="#ff3d8b" stroke="#3a2e5c" stroke-width="8"/>

